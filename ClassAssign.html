<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阳光分班系统（脱敏版）</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a5276 0%, #2874a6 50%, #3498db 100%);
            color: #fff;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="80" cy="20" r="15" fill="rgba(255,220,100,0.3)"/><circle cx="85" cy="18" r="12" fill="rgba(255,200,80,0.2)"/></svg>') no-repeat 90% 5%, 
                        linear-gradient(to bottom, rgba(255,255,255,0.1) 0%, transparent 30%);
            pointer-events: none;
            z-index: 0;
        }
        .container { position: relative; z-index: 1; padding: 20px; height: 100vh; display: flex; flex-direction: column; }
        
        /* Header区域 */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.3); border-radius: 10px; padding: 15px 25px;
            margin-bottom: 20px; border: 1px solid rgba(255,204,0,0.5);
        }
        .header-left { display: flex; flex-direction: column; }
        .header-center { text-align: center; flex: 1; }
        .header-center h1 { margin: 0; font-size: 28px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .header-right { display: flex; gap: 20px; }
        
        /* 时间显示 */
        .time-display {
            background: rgba(0,0,0,0.4); border: 2px solid #ffcc00; border-radius: 8px;
            padding: 8px 15px; text-align: center; min-width: 200px;
        }
        .time-display .label { font-size: 12px; color: #ffcc00; margin-bottom: 3px; }
        .time-display .time { font-size: 16px; font-weight: bold; font-family: monospace; }
        
        /* 统计徽章 */
        .stat-badge {
            background: rgba(0,0,0,0.4); border: 2px solid #ffcc00; border-radius: 8px;
            padding: 8px 15px; text-align: center; min-width: 100px;
        }
        .stat-badge .label { font-size: 12px; color: #ffcc00; margin-bottom: 3px; }
        .stat-badge .value { font-size: 24px; font-weight: bold; color: #ffcc00; }
        
        /* 主体区域 */
        .main-container { display: flex; flex: 1; gap: 20px; min-height: 0; }
        
        /* 左侧面板 */
        .left-panel { 
            width: 320px; background: rgba(0, 0, 0, 0.4); border-radius: 10px; 
            padding: 15px; display: flex; flex-direction: column; 
            border: 1px solid rgba(255,255,255,0.2);
        }
        .left-panel h3 { 
            margin: 0 0 10px 0; text-align: center; border-bottom: 1px solid #ffcc00; 
            padding-bottom: 10px; color: #ffcc00; font-size: 16px; display: flex;
            justify-content: space-between; align-items: center;
        }
        .progress-bar {
            height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; margin-bottom: 10px; overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%; background: linear-gradient(90deg, #ffcc00, #ff9900);
            transition: width 1s ease; border-radius: 3px;
        }
        .student-list { flex: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
        .student-list li { 
            padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.1); 
            font-size: 13px; background: rgba(255,255,255,0.05); margin-bottom: 2px; 
            display: flex; justify-content: space-between; align-items: center;
        }
        .student-list li:hover { background: rgba(255,255,255,0.1); }
        .student-list .stu-info { display: flex; flex-direction: column; gap: 2px; }
        .student-list .stu-name { font-weight: bold; color: #fff; }
        .student-list .stu-detail { font-size: 11px; color: rgba(255,255,255,0.6); }
        .student-list .stu-origin { font-size: 11px; color: #87ceeb; }
        .student-list .stu-seq { color: rgba(255,255,255,0.4); font-size: 11px; min-width: 30px; text-align: right; }
        
        /* 中间面板 */
        .center-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .current-student { 
            background: linear-gradient(135deg, rgba(0,120,212,0.8), rgba(0,80,160,0.9));
            border: 3px solid #ffcc00; border-radius: 15px; padding: 25px 50px; 
            font-size: 28px; text-align: center; margin-bottom: 30px; 
            box-shadow: 0 0 30px rgba(255,204,0,0.4), inset 0 0 20px rgba(255,255,255,0.1);
            min-width: 500px; animation: none;
        }
        .current-student .stu-name { font-size: 36px; font-weight: bold; color: #ffcc00; margin-bottom: 10px; }
        .current-student .stu-id { font-size: 16px; color: rgba(255,255,255,0.8); margin-bottom: 8px; }
        .current-student .stu-arrow { font-size: 24px; color: #00ff00; margin-top: 10px; }
        
        /* 班级网格 */
        .class-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 15px; width: 100%; margin-top: 20px; }
        .class-box { 
            background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
            border: 2px solid rgba(255,204,0,0.6); border-radius: 12px; padding: 15px; 
            text-align: center; height: 130px; display: flex; flex-direction: column; 
            justify-content: space-between; cursor: pointer; transition: all 1s;
        }
        .class-box:hover { 
            background: linear-gradient(135deg, rgba(255,204,0,0.3), rgba(255,153,0,0.2));
            border-color: #ffcc00; transform: translateY(-8px); box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .class-name { font-size: 20px; font-weight: bold; color: #fff; }
        .class-count { font-size: 36px; font-weight: bold; color: #ffcc00; text-shadow: 0 0 10px rgba(255,204,0,0.5); }
        .class-tip { font-size: 12px; color: rgba(255,255,255,0.6); }
        
        /* 控制按钮 */
        .controls { text-align: center; margin-top: 20px; }
        button { padding: 12px 30px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; background: linear-gradient(135deg, #ffcc00, #ff9900); color: #000; font-weight: bold; margin: 0 15px; transition: all 1s; box-shadow: 0 4px 15px rgba(255,153,0,0.4); }
        button:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(255,153,0,0.6); }
        button:active { transform: translateY(0); }
        #pauseBtn { background: linear-gradient(135deg, #ff9800, #ff5722); }
        #pauseBtn:hover { box-shadow: 0 6px 20px rgba(255,87,34,0.6); }
        #pauseBtn.resume { background: linear-gradient(135deg, #4caf50, #2e7d32); }
        #pauseBtn.resume:hover { box-shadow: 0 6px 20px rgba(76,175,80,0.6); }
        
        /* 模态框 */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
        .modal-content { background: linear-gradient(135deg, #1a3a5c, #0d2137); padding: 25px; border-radius: 15px; width: 450px; max-height: 500px; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.5); border: 2px solid #ffcc00; }
        .close { color: #ffcc00; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close:hover { color: #fff; }
        .modal-title { text-align: center; margin-bottom: 15px; color: #ffcc00; font-size: 22px; }
        .modal-list { list-style: none; padding: 0; margin: 0; }
        .modal-list li { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .modal-list .name { font-weight: bold; color: #fff; }
        .modal-list .id-card { color: rgba(255,255,255,0.6); font-size: 12px; }
        
        /* 动画 */
        @keyframes flash { 
            0% { transform: scale(1); box-shadow: 0 0 30px rgba(255,204,0,0.4); } 
            50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(255,204,0,0.8), 0 0 80px rgba(255,153,0,0.5); } 
            100% { transform: scale(1); box-shadow: 0 0 30px rgba(255,204,0,0.4); } 
        }
        .animate-flash { animation: flash 1s ease-in-out; }
        
        @keyframes slideIn {
            0% { opacity: 0; transform: translateY(-20px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-slide-in { animation: slideIn 1s ease-out; }
        
        @keyframes countPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); color: #fff; }
        }
        .animate-count { animation: countPulse 1s ease-out; }
        
        /* 飞向班级动画 */
        @keyframes flyToTarget {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--target-x), var(--target-y)) scale(0.2); opacity: 0; }
        }
        .animate-fly { animation: flyToTarget 1s ease-in forwards; }
        
        .fly-card {
            position: fixed;
            background: linear-gradient(135deg, #1a3a5c, #0d2137);
            border: 2px solid #ffcc00;
            border-radius: 12px;
            padding: 15px 25px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            z-index: 1000;
            pointer-events: none;
            box-shadow: 0 0 30px rgba(255,204,0,0.6);
        }
        
        @keyframes classGlow {
            0% { box-shadow: 0 0 20px rgba(255,153,0,0.3); }
            50% { box-shadow: 0 0 40px rgba(255,204,0,0.8), 0 0 60px rgba(255,153,0,0.6); transform: scale(1.05); }
            100% { box-shadow: 0 0 20px rgba(255,153,0,0.3); }
        }
        .animate-class-glow { animation: classGlow 1s ease-out; }
        
        /* 滚动条样式 */
        .student-list::-webkit-scrollbar { width: 6px; }
        .student-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 3px; }
        .student-list::-webkit-scrollbar-thumb { background: #ffcc00; border-radius: 3px; }
    </style>
</head>

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('current-time').textContent = `${year}年${month}月${day}日 ${hours}:${minutes}:${seconds}`;
        }

        // 4. 初始化界面
        function init() {
            updateTime();
            setInterval(updateTime, 1000);
            
            const listEl = document.getElementById('unassigned-list');
            listEl.innerHTML = '';
            students.forEach((student, index) => {
                const li = document.createElement('li');
                const maskedId = student.idCard.slice(0, 6) + '********' + student.idCard.slice(-4);
                li.innerHTML = `
                    <div class="stu-info">
                        <div class="stu-name">${student.name}</div>
                        <div class="stu-detail">${maskedId}</div>
                        <div class="stu-origin">原班级: ${student.originClass}</div>
                    </div>
                    <div class="stu-seq">${String(index + 1).padStart(3, '0')}</div>
                `;
                listEl.appendChild(li);
            });
            
            const gridEl = document.getElementById('class-grid');
            gridEl.innerHTML = '';
            classes.forEach((cls, index) => {
                const div = document.createElement('div');
                div.className = 'class-box';
                div.id = `class-${cls.name}`;
                div.onclick = () => showClassDetails(index); 
                div.innerHTML = `
                    <div class="class-name">${cls.name}</div>
                    <div class="class-count" id="count-${cls.name}">0</div>
                    <div class="class-tip">点击查看名单</div>
                `;
                gridEl.appendChild(div);
            });

            document.getElementById('remaining-count').textContent = students.length;
            document.getElementById('current-student').innerHTML = '<div style="color: rgba(255,255,255,0.7);">等待分班...</div>';
            document.getElementById('progress-fill').style.width = '0%';
            document.getElementById('pauseBtn').style.display = 'none';
            closeModal();
        }

        // 洗牌算法
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 5. 分班逻辑
        function startAllocation() {
            if (timer) clearInterval(timer);
            isPaused = false;
            currentPool = shuffle([...students]);
            document.getElementById('pauseBtn').style.display = 'inline-block';
            document.getElementById('pauseBtn').textContent = '暂停';
            document.getElementById('pauseBtn').classList.remove('resume');
            
            timer = setInterval(() => {
                if (currentPool.length === 0) {
                    clearInterval(timer);
                    timer = null;
                    document.getElementById('current-student').innerHTML = '<div style="color: #00ff00; font-size: 32px;">分班完成!</div>';
                    document.getElementById('progress-fill').style.width = '100%';
                    document.getElementById('pauseBtn').style.display = 'none';
                    return;
                }

                const studentObj = currentPool.shift();
                let targetClassIndex = (420 - currentPool.length) % 7; 
                
                const targetClass = classes[targetClassIndex];
                targetClass.members.push(studentObj);
                targetClass.count = targetClass.members.length;

                // 更新左侧列表
                const listEl = document.getElementById('unassigned-list');
                if (listEl.firstChild) listEl.removeChild(listEl.firstChild);
                document.getElementById('remaining-count').textContent = currentPool.length;
                
                // 更新进度条
                const progress = ((420 - currentPool.length) / 420) * 100;
                document.getElementById('progress-fill').style.width = progress + '%';

                // 更新中心显示 - 更漂亮的布局
                const maskedId = studentObj.idCard.slice(0, 6) + '********' + studentObj.idCard.slice(-4);
                const currentEl = document.getElementById('current-student');
                currentEl.innerHTML = `
                    <div class="stu-name">${studentObj.name}</div>
                    <div class="stu-id">身份证: ${maskedId}</div>
                    <div class="stu-id">原班级: ${studentObj.originClass}</div>
                    <div class="stu-arrow">已分配到 ${targetClass.name}</div>
                `;
                currentEl.classList.remove('animate-flash');
                void currentEl.offsetWidth; 
                currentEl.classList.add('animate-flash');

                // 飞向班级动画
                flyToClass(studentObj.name, targetClass.name);

                // 更新班级卡片人数
                const classEl = document.getElementById(`class-${targetClass.name}`);
                const countEl = document.getElementById(`count-${targetClass.name}`);
                countEl.textContent = targetClass.count;
                countEl.classList.remove('animate-count');
                void countEl.offsetWidth;
                countEl.classList.add('animate-count');

            }, ALLOCATION_INTERVAL);
        }

        // 飞向班级动画
        function flyToClass(studentName, targetClassName) {
            const centerEl = document.getElementById('current-student');
            const classEl = document.getElementById(`class-${targetClassName}`);
            
            if (!centerEl || !classEl) return;
            
            const centerRect = centerEl.getBoundingClientRect();
            const classRect = classEl.getBoundingClientRect();
            
            // 创建飞行卡片
            const flyCard = document.createElement('div');
            flyCard.className = 'fly-card';
            flyCard.textContent = studentName;
            flyCard.style.left = centerRect.left + 'px';
            flyCard.style.top = centerRect.top + 'px';
            document.body.appendChild(flyCard);
            
            // 计算偏移量
            const targetX = classRect.left + classRect.width / 2 - centerRect.left - centerRect.width / 2;
            const targetY = classRect.top + classRect.height / 2 - centerRect.top - centerRect.height / 2;
            
            flyCard.style.setProperty('--target-x', targetX + 'px');
            flyCard.style.setProperty('--target-y', targetY + 'px');
            
            // 触发动画
            requestAnimationFrame(() => {
                flyCard.classList.add('animate-fly');
            });
            
            // 动画结束后移除
            setTimeout(() => {
                flyCard.remove();
            }, ALLOCATION_INTERVAL);
            
            // 班级卡片发光效果
            classEl.classList.remove('animate-class-glow');
            void classEl.offsetWidth;
            classEl.classList.add('animate-class-glow');
        }

        // 暂停分班
        function pauseAllocation() {
            if (timer) {
                clearInterval(timer);
                timer = null;
                isPaused = true;
                document.getElementById('pauseBtn').textContent = '继续';
                document.getElementById('pauseBtn').classList.add('resume');
                document.getElementById('current-student').innerHTML += '<div style="color: #ff9800; font-size: 18px; margin-top: 15px;">已暂停</div>';
            }
        }

        // 继续分班
        function resumeAllocation() {
            if (isPaused && currentPool.length > 0) {
                isPaused = false;
                document.getElementById('pauseBtn').textContent = '暂停';
                document.getElementById('pauseBtn').classList.remove('resume');
                
                timer = setInterval(() => {
                    if (currentPool.length === 0) {
                        clearInterval(timer);
                        timer = null;
                        document.getElementById('current-student').innerHTML = '<div style="color: #00ff00; font-size: 32px;">分班完成!</div>';
                        document.getElementById('progress-fill').style.width = '100%';
                        document.getElementById('pauseBtn').style.display = 'none';
                        return;
                    }

                    const studentObj = currentPool.shift();
                    let targetClassIndex = (420 - currentPool.length) % 7; 
                    
                    const targetClass = classes[targetClassIndex];
                    targetClass.members.push(studentObj);
                    targetClass.count = targetClass.members.length;

                    // 更新左侧列表
                    const listEl = document.getElementById('unassigned-list');
                    if (listEl.firstChild) listEl.removeChild(listEl.firstChild);
                    document.getElementById('remaining-count').textContent = currentPool.length;
                    
                    // 更新进度条
                    const progress = ((420 - currentPool.length) / 420) * 100;
                    document.getElementById('progress-fill').style.width = progress + '%';

                    // 更新中心显示
                    const maskedId = studentObj.idCard.slice(0, 6) + '********' + studentObj.idCard.slice(-4);
                    const currentEl = document.getElementById('current-student');
                    currentEl.innerHTML = `
                        <div class="stu-name">${studentObj.name}</div>
                        <div class="stu-id">身份证: ${maskedId}</div>
                        <div class="stu-id">原班级: ${studentObj.originClass}</div>
                        <div class="stu-arrow">已分配到 ${targetClass.name}</div>
                    `;
                    currentEl.classList.remove('animate-flash');
                    void currentEl.offsetWidth; 
                    currentEl.classList.add('animate-flash');

                    // 飞向班级动画
                    flyToClass(studentObj.name, targetClass.name);

                    // 更新班级卡片人数
                    const classEl = document.getElementById(`class-${targetClass.name}`);
                    const countEl = document.getElementById(`count-${targetClass.name}`);
                    countEl.textContent = targetClass.count;
                    countEl.classList.remove('animate-count');
                    void countEl.offsetWidth;
                    countEl.classList.add('animate-count');

                }, ALLOCATION_INTERVAL);
            }
        }

        // 6. 弹窗查看班级名单
        function showClassDetails(index) {
            const cls = classes[index];
            document.getElementById('modalTitle').textContent = `${cls.name} 学生名单 (${cls.count}人)`;
            const list = document.getElementById('modalList');
            list.innerHTML = '';
            
            if (cls.members.length === 0) {
                const li = document.createElement('li');
                li.textContent = '暂无学生';
                list.appendChild(li);
            } else {
                cls.members.forEach((student, i) => {
                    const li = document.createElement('li');
                    const maskedId = student.idCard.slice(0, 6) + '********' + student.idCard.slice(-4);
                    li.innerHTML = `<span class="name">${i + 1}. ${student.name}</span> <span class="id-card">${maskedId}</span>`;
                    list.appendChild(li);
                });
            }
            document.getElementById('myModal').style.display = "flex";
        }

        // 关闭模态框
        function closeModal() {
            document.getElementById('myModal').style.display = "none";
        }

        // 重置
        function resetAllocation() {
            if (timer) clearInterval(timer);
            timer = null;
            isPaused = false;
            document.getElementById('pauseBtn').style.display = 'none';
            classes.forEach(cls => {
                cls.members = [];
                cls.count = 0;
            });
            init(); 
        }

        // 初始化与事件绑定
        window.onload = init;
        document.getElementById('startBtn').addEventListener('click', startAllocation);
        document.getElementById('pauseBtn').addEventListener('click', function() {
            if (isPaused) {
                resumeAllocation();
            } else {
                pauseAllocation();
            }
        });
        document.getElementById('resetBtn').addEventListener('click', resetAllocation);
        document.getElementById('exportBtn').addEventListener('click', exportResults);
        
        // 导出分班结果
        function exportResults() {
            const wb = XLSX.utils.book_new();
            
            classes.forEach((cls, index) => {
                const data = cls.members.map((student, i) => ({
                    '序号': i + 1,
                    '姓名': student.name,
                    '身份证号': student.idCard,
                    '原班级': student.originClass
                }));
                const ws = XLSX.utils.json_to_sheet(data);
                XLSX.utils.book_append_sheet(wb, ws, cls.name);
            });
            
            const date = new Date().toLocaleDateString('zh-CN').replace(/\//g, '-');
            XLSX.writeFile(wb, `分班结果_${date}.xlsx`);
        }
        
        // 点击弹窗外区域关闭
        window.onclick = function(event) {
            const modal = document.getElementById('myModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
