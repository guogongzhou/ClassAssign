:root{--blue:#1677c8;--blue2:#0f5ea8;--green:#35a875;--ink:#17324d;--muted:#6d8194;--glass:rgba(255,255,255,.84);--line:rgba(255,255,255,.58);--shadow:0 18px 50px rgba(12,48,79,.18)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink)}
body{overflow:hidden;background:#dfeef7;position:relative}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(115deg,rgba(9,58,91,.72),rgba(22,119,200,.38) 52%,rgba(28,124,91,.34)),url("https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=2200&q=85") center/cover no-repeat;filter:saturate(.92);z-index:-3}
body:after{content:"";position:fixed;inset:0;background:radial-gradient(circle at 80% 8%,rgba(255,255,255,.28),transparent 28%),linear-gradient(to bottom,rgba(255,255,255,.08),rgba(7,39,63,.22));z-index:-2;pointer-events:none}
.container{position:relative;height:100vh;min-height:680px;padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.header{height:76px;display:grid;grid-template-columns:260px 1fr 300px;align-items:center;padding:0 18px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.18);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 35px rgba(0,35,65,.15);color:#fff}
.header-left{display:flex;align-items:center}.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.9);color:var(--blue);display:grid;place-items:center;font-size:22px;box-shadow:0 6px 20px rgba(0,0,0,.12)}.brand-text b{display:block;font-size:15px;letter-spacing:1px}.brand-text span{font-size:11px;opacity:.78}
.header-center{text-align:center}.header-center h1{margin:0;font-size:25px;font-weight:650;letter-spacing:3px;text-shadow:0 2px 10px rgba(0,0,0,.18)}.subtitle{margin-top:5px;font-size:11px;letter-spacing:4px;opacity:.78}
.header-right{display:flex;justify-content:flex-end;gap:10px}.time-display,.stat-badge{min-width:96px;padding:9px 12px;border:1px solid rgba(255,255,255,.45);border-radius:13px;background:rgba(255,255,255,.14);text-align:center}.time-display{min-width:160px}.label{font-size:10px;opacity:.7;letter-spacing:1px}.time{font:600 14px/1.4 Consolas,monospace}.stat-badge .value{font-size:22px;font-weight:750;line-height:1.1;margin-top:2px}
.main-container{display:grid;grid-template-columns:285px minmax(0,1fr);gap:14px;flex:1;min-height:0}.left-panel,.stage{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow);border-radius:20px}
.left-panel{padding:17px;display:flex;flex-direction:column;min-height:0}.panel-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.panel-title h3{margin:0;font-size:16px}.panel-title span{font-size:11px;color:var(--muted)}.remaining{font-size:30px;font-weight:800;color:var(--blue)}.progress-wrap{height:8px;border-radius:99px;background:#e8eef3;overflow:hidden;margin-bottom:12px}.progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:99px;transition:width .35s ease}.student-list{flex:1;overflow-y:auto;list-style:none;padding:0;margin:0}.student-list li{padding:9px 10px;border-bottom:1px solid #edf1f4;background:rgba(255,255,255,.36);margin-bottom:3px;border-radius:9px;display:flex;justify-content:space-between;align-items:center;transition:.2s}.student-list li:hover{background:#fff;transform:translateX(2px)}.student-list .stu-info{display:flex;flex-direction:column;gap:2px}.student-list .stu-name{font-weight:700;color:var(--ink);font-size:13px}.student-list .stu-detail{font-size:10px;color:#91a0ad}.student-list .stu-origin{font-size:10px;color:var(--blue)}.student-list .stu-seq{color:#a4b0ba;font:11px Consolas,monospace}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:25px}.stage:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(22,119,200,.12),transparent 68%);top:50%;left:50%;transform:translate(-50%,-55%);pointer-events:none}.stage-caption{position:relative;z-index:1;color:#7890a2;font-size:12px;letter-spacing:3px;margin-bottom:14px}.current-student{position:relative;z-index:1;width:min(610px,90%);min-height:225px;padding:27px 40px;border:1px solid rgba(255,255,255,.8);border-radius:24px;background:rgba(255,255,255,.78);box-shadow:0 20px 55px rgba(22,83,126,.16);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}.current-student .stu-name{font-size:40px;line-height:1.1;font-weight:800;color:var(--ink);letter-spacing:2px}.current-student .stu-id{font-size:12px;color:#7b8c9b;margin-top:8px}.current-student .route{display:flex;align-items:center;gap:15px;margin-top:15px;font-size:13px;color:#617587}.current-student .route strong{font-size:15px;color:var(--blue)}.current-student .stu-arrow{margin-top:13px;padding:7px 15px;border-radius:99px;background:#e9f7f0;color:#21805a;font-size:12px;font-weight:700}
.class-grid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));gap:10px;width:100%;margin-top:18px}.class-box{height:112px;padding:13px 10px;border:1px solid #dce8ef;border-radius:16px;background:rgba(255,255,255,.72);text-align:center;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:.25s;box-shadow:0 6px 20px rgba(19,70,100,.07)}.class-box:hover{transform:translateY(-4px);background:#fff;border-color:#acd3ed;box-shadow:0 13px 28px rgba(19,70,100,.13)}.class-box.active{border-color:#72b9e6;box-shadow:0 0 0 3px rgba(22,119,200,.1),0 14px 28px rgba(22,119,200,.16)}.class-name{font-size:14px;font-weight:750;color:var(--ink)}.class-count{font-size:30px;line-height:1;font-weight:850;color:var(--blue)}.class-tip{font-size:10px;color:#93a3af}.class-tip:before{content:"已分配 / 60"}
.controls{position:relative;z-index:3;display:flex;justify-content:center;gap:10px;margin-top:0}.controls button{padding:11px 24px;font-size:14px;border:1px solid rgba(255,255,255,.5);border-radius:12px;cursor:pointer;background:rgba(255,255,255,.78);color:var(--ink);font-weight:700;transition:.22s;box-shadow:0 7px 20px rgba(10,50,80,.12);margin:0}.controls button:hover{transform:translateY(-2px);background:#fff}.controls #startBtn{background:linear-gradient(135deg,#2188d2,#176cb0);color:#fff;border:none;min-width:150px;box-shadow:0 9px 24px rgba(23,108,176,.28)}.controls #pauseBtn{background:#fff7e7;color:#a66a00}.controls #pauseBtn.resume{background:#eaf8f1;color:#21805a}
.status-line{position:relative;z-index:2;display:flex;justify-content:center;gap:22px;color:rgba(255,255,255,.9);font-size:11px;margin-top:-2px}.status-line span{display:flex;align-items:center;gap:5px}.status-line i{width:6px;height:6px;border-radius:50%;background:#62c895;box-shadow:0 0 8px rgba(98,200,149,.8)}
.modal{display:none;position:fixed;z-index:100;inset:0;background:rgba(5,31,50,.52);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);justify-content:center;align-items:center}.modal-content{background:rgba(255,255,255,.96);padding:24px;border-radius:22px;width:480px;max-height:620px;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.8);color:var(--ink)}.close{color:#7f93a3;float:right;font-size:28px;font-weight:400;cursor:pointer}.close:hover{color:var(--blue)}.modal-title{text-align:center;margin:2px 0 16px;color:var(--ink);font-size:20px}.modal-list{list-style:none;padding:0;margin:0}.modal-list li{padding:10px 4px;border-bottom:1px solid #edf1f4;display:flex;justify-content:space-between;align-items:center}.modal-list .name{font-weight:700}.modal-list .id-card{color:#8c9ba7;font-size:11px}
@keyframes flash{0%{transform:scale(.98);box-shadow:0 10px 30px rgba(22,119,200,.08)}45%{transform:scale(1.015);box-shadow:0 18px 55px rgba(22,119,200,.22),0 0 0 5px rgba(53,168,117,.08)}100%{transform:scale(1);box-shadow:0 20px 55px rgba(22,83,126,.16)}}.animate-flash{animation:flash .55s ease-out}.animate-count{animation:countPulse .45s ease-out}@keyframes countPulse{50%{transform:scale(1.16);color:var(--green)}}
@keyframes flyToTarget{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--target-x),var(--target-y)) scale(.55);opacity:0}}.animate-fly{animation:flyToTarget .72s cubic-bezier(.2,.8,.3,1) forwards}.fly-card{position:fixed;background:rgba(255,255,255,.96);border:1px solid #acd3ed;border-radius:12px;padding:10px 18px;color:var(--ink);font-size:15px;font-weight:800;z-index:1000;pointer-events:none;box-shadow:0 15px 35px rgba(0,60,100,.18)}
.student-list::-webkit-scrollbar,.modal-content::-webkit-scrollbar{width:5px}.student-list::-webkit-scrollbar-thumb,.modal-content::-webkit-scrollbar-thumb{background:#c9d9e3;border-radius:5px}

</style>

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('current-time').textContent = `${year}年${month}月${day}日 ${hours}:${minutes}:${seconds}`;
        }

        // 4. 初始化界面
        function init() {
            updateTime();
            setInterval(updateTime, 1000);
            
            const listEl = document.getElementById('unassigned-list');
            listEl.innerHTML = '';
            students.forEach((student, index) => {
                const li = document.createElement('li');
                const maskedId = student.idCard.slice(0, 6) + '********' + student.idCard.slice(-4);
                li.innerHTML = `
                    <div class="stu-info">
                        <div class="stu-name">${student.name}</div>
                        <div class="stu-detail">${maskedId}</div>
                        <div class="stu-origin">原班级: ${student.originClass}</div>
                    </div>
                    <div class="stu-seq">${String(index + 1).padStart(3, '0')}</div>
                `;
                listEl.appendChild(li);
            });
            
            const gridEl = document.getElementById('class-grid');
            gridEl.innerHTML = '';
            classes.forEach((cls, index) => {
                const div = document.createElement('div');
                div.className = 'class-box';
                div.id = `class-${cls.name}`;
                div.onclick = () => showClassDetails(index); 
                div.innerHTML = `
                    <div class="class-name">${cls.name}</div>
                    <div class="class-count" id="count-${cls.name}">0</div>
                    <div class="class-tip">点击查看名单</div>
                `;
                gridEl.appendChild(div);
            });

            document.getElementById('remaining-count').textContent = students.length;
            document.getElementById('current-student').innerHTML = '<div style="color: rgba(255,255,255,0.7);">等待分班...</div>';
            document.getElementById('progress-fill').style.width = '0%';
            document.getElementById('pauseBtn').style.display = 'none';
            closeModal();
        }

        // 洗牌算法
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 5. 分班逻辑
        function startAllocation() {
            if (timer) clearInterval(timer);
            isPaused = false;
            currentPool = shuffle([...students]);
            document.getElementById('pauseBtn').style.display = 'inline-block';
            document.getElementById('pauseBtn').textContent = '暂停';
            document.getElementById('pauseBtn').classList.remove('resume');
            
            timer = setInterval(() => {
                if (currentPool.length === 0) {
                    clearInterval(timer);
                    timer = null;
                    document.getElementById('current-student').innerHTML = '<div style="color: #00ff00; font-size: 32px;">分班完成!</div>';
                    document.getElementById('progress-fill').style.width = '100%';
                    document.getElementById('pauseBtn').style.display = 'none';
                    return;
                }

                const studentObj = currentPool.shift();
                let targetClassIndex = (420 - currentPool.length) % 7; 
                
                const targetClass = classes[targetClassIndex];
                targetClass.members.push(studentObj);
                targetClass.count = targetClass.members.length;

                // 更新左侧列表
                const listEl = document.getElementById('unassigned-list');
                if (listEl.firstChild) listEl.removeChild(listEl.firstChild);
                document.getElementById('remaining-count').textContent = currentPool.length;
                
                // 更新进度条
                const progress = ((420 - currentPool.length) / 420) * 100;
                document.getElementById('progress-fill').style.width = progress + '%';

                // 更新中心显示 - 更漂亮的布局
                const maskedId = studentObj.idCard.slice(0, 6) + '********' + studentObj.idCard.slice(-4);
                const currentEl = document.getElementById('current-student');
                currentEl.innerHTML = `
                    <div class="stu-name">${studentObj.name}</div>
                    <div class="stu-id">身份证: ${maskedId}</div>
                    <div class="stu-id">原班级: ${studentObj.originClass}</div>
                    <div class="stu-arrow">已分配到 ${targetClass.name}</div>
                `;
                currentEl.classList.remove('animate-flash');
                void currentEl.offsetWidth; 
                currentEl.classList.add('animate-flash');

                // 飞向班级动画
                flyToClass(studentObj.name, targetClass.name);

                // 更新班级卡片人数
                const classEl = document.getElementById(`class-${targetClass.name}`);
                const countEl = document.getElementById(`count-${targetClass.name}`);
                countEl.textContent = targetClass.count;
                countEl.classList.remove('animate-count');
                void countEl.offsetWidth;
                countEl.classList.add('animate-count');

            }, ALLOCATION_INTERVAL);
        }

        // 飞向班级动画
        function flyToClass(studentName, targetClassName) {
            const centerEl = document.getElementById('current-student');
            const classEl = document.getElementById(`class-${targetClassName}`);
            
            if (!centerEl || !classEl) return;
            
            const centerRect = centerEl.getBoundingClientRect();
            const classRect = classEl.getBoundingClientRect();
            
            // 创建飞行卡片
            const flyCard = document.createElement('div');
            flyCard.className = 'fly-card';
            flyCard.textContent = studentName;
            flyCard.style.left = centerRect.left + 'px';
            flyCard.style.top = centerRect.top + 'px';
            document.body.appendChild(flyCard);
            
            // 计算偏移量
            const targetX = classRect.left + classRect.width / 2 - centerRect.left - centerRect.width / 2;
            const targetY = classRect.top + classRect.height / 2 - centerRect.top - centerRect.height / 2;
            
            flyCard.style.setProperty('--target-x', targetX + 'px');
            flyCard.style.setProperty('--target-y', targetY + 'px');
            
            // 触发动画
            requestAnimationFrame(() => {
                flyCard.classList.add('animate-fly');
            });
            
            // 动画结束后移除
            setTimeout(() => {
                flyCard.remove();
            }, ALLOCATION_INTERVAL);
            
            // 班级卡片发光效果
            classEl.classList.remove('animate-class-glow');
            void classEl.offsetWidth;
            classEl.classList.add('animate-class-glow');
        }

        // 暂停分班
        function pauseAllocation() {
            if (timer) {
                clearInterval(timer);
                timer = null;
                isPaused = true;
                document.getElementById('pauseBtn').textContent = '继续';
                document.getElementById('pauseBtn').classList.add('resume');
                document.getElementById('current-student').innerHTML += '<div style="color: #ff9800; font-size: 18px; margin-top: 15px;">已暂停</div>';
            }
        }

        // 继续分班
        function resumeAllocation() {
            if (isPaused && currentPool.length > 0) {
                isPaused = false;
                document.getElementById('pauseBtn').textContent = '暂停';
                document.getElementById('pauseBtn').classList.remove('resume');
                
                timer = setInterval(() => {
                    if (currentPool.length === 0) {
                        clearInterval(timer);
                        timer = null;
                        document.getElementById('current-student').innerHTML = '<div style="color: #00ff00; font-size: 32px;">分班完成!</div>';
                        document.getElementById('progress-fill').style.width = '100%';
                        document.getElementById('pauseBtn').style.display = 'none';
                        return;
                    }

                    const studentObj = currentPool.shift();
                    let targetClassIndex = (420 - currentPool.length) % 7; 
                    
                    const targetClass = classes[targetClassIndex];
                    targetClass.members.push(studentObj);
                    targetClass.count = targetClass.members.length;

                    // 更新左侧列表
                    const listEl = document.getElementById('unassigned-list');
                    if (listEl.firstChild) listEl.removeChild(listEl.firstChild);
                    document.getElementById('remaining-count').textContent = currentPool.length;
                    
                    // 更新进度条
                    const progress = ((420 - currentPool.length) / 420) * 100;
                    document.getElementById('progress-fill').style.width = progress + '%';

                    // 更新中心显示
                    const maskedId = studentObj.idCard.slice(0, 6) + '********' + studentObj.idCard.slice(-4);
                    const currentEl = document.getElementById('current-student');
                    currentEl.innerHTML = `
                        <div class="stu-name">${studentObj.name}</div>
                        <div class="stu-id">身份证: ${maskedId}</div>
                        <div class="stu-id">原班级: ${studentObj.originClass}</div>
                        <div class="stu-arrow">已分配到 ${targetClass.name}</div>
                    `;
                    currentEl.classList.remove('animate-flash');
                    void currentEl.offsetWidth; 
                    currentEl.classList.add('animate-flash');

                    // 飞向班级动画
                    flyToClass(studentObj.name, targetClass.name);

                    // 更新班级卡片人数
                    const classEl = document.getElementById(`class-${targetClass.name}`);
                    const countEl = document.getElementById(`count-${targetClass.name}`);
                    countEl.textContent = targetClass.count;
                    countEl.classList.remove('animate-count');
                    void countEl.offsetWidth;
                    countEl.classList.add('animate-count');

                }, ALLOCATION_INTERVAL);
            }
        }

        // 6. 弹窗查看班级名单
        function showClassDetails(index) {
            const cls = classes[index];
            document.getElementById('modalTitle').textContent = `${cls.name} 学生名单 (${cls.count}人)`;
            const list = document.getElementById('modalList');
            list.innerHTML = '';
            
            if (cls.members.length === 0) {
                const li = document.createElement('li');
                li.textContent = '暂无学生';
                list.appendChild(li);
            } else {
                cls.members.forEach((student, i) => {
                    const li = document.createElement('li');
                    const maskedId = student.idCard.slice(0, 6) + '********' + student.idCard.slice(-4);
                    li.innerHTML = `<span class="name">${i + 1}. ${student.name}</span> <span class="id-card">${maskedId}</span>`;
                    list.appendChild(li);
                });
            }
            document.getElementById('myModal').style.display = "flex";
        }

        // 关闭模态框
        function closeModal() {
            document.getElementById('myModal').style.display = "none";
        }

        // 重置
        function resetAllocation() {
            if (timer) clearInterval(timer);
            timer = null;
            isPaused = false;
            document.getElementById('pauseBtn').style.display = 'none';
            classes.forEach(cls => {
                cls.members = [];
                cls.count = 0;
            });
            init(); 
        }

        // 初始化与事件绑定
        window.onload = init;
        document.getElementById('startBtn').addEventListener('click', startAllocation);
        document.getElementById('pauseBtn').addEventListener('click', function() {
            if (isPaused) {
                resumeAllocation();
            } else {
                pauseAllocation();
            }
        });
        document.getElementById('resetBtn').addEventListener('click', resetAllocation);
        document.getElementById('exportBtn').addEventListener('click', exportResults);
        
        // 导出分班结果
        function exportResults() {
            const wb = XLSX.utils.book_new();
            
            classes.forEach((cls, index) => {
                const data = cls.members.map((student, i) => ({
                    '序号': i + 1,
                    '姓名': student.name,
                    '身份证号': student.idCard,
                    '原班级': student.originClass
                }));
                const ws = XLSX.utils.json_to_sheet(data);
                XLSX.utils.book_append_sheet(wb, ws, cls.name);
            });
            
            const date = new Date().toLocaleDateString('zh-CN').replace(/\//g, '-');
            XLSX.writeFile(wb, `分班结果_${date}.xlsx`);
        }
        
        // 点击弹窗外区域关闭
        window.onclick = function(event) {
            const modal = document.getElementById('myModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
